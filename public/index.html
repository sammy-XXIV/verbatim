<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verbatim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
  :root {
    --box: #F3B8C4; --box-deep: #E89AAA; --ink: #2A1912; --paper: #FFFDF6;
    --ok: #2E7A4C; --no: #C2302A; --chat: #DCF3D0; --note: #FFE27A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--ink); font: 16px/1.5 'Space Grotesk', system-ui, sans-serif;
    background: var(--box); min-height: 100vh;
  }
  button, textarea, input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  header { display: flex; align-items: center; gap: 14px; padding: 20px 24px 8px; max-width: 1240px; margin: 0 auto; }
  .logo { width: 64px; height: 44px; }
  .logo path { fill: none; stroke: var(--ink); stroke-width: 5; stroke-linecap: round; }
  h1 { margin: 0; font-size: 34px; letter-spacing: -1px; line-height: 1; }
  .shop { margin-left: auto; font-weight: 500; }

  .stage { max-width: 1240px; margin: 0 auto; padding: 16px 24px 48px; display: grid; gap: 28px;
    grid-template-columns: minmax(280px, 1fr) minmax(300px, 380px) minmax(220px, 280px); align-items: start; }
  @media (max-width: 1000px) { .stage { grid-template-columns: 1fr; } }

  h2 { font-size: 18px; margin: 0 0 10px; }

  /* Chat */
  .chat { background: #EFE7DC; border: 2px solid var(--ink); border-radius: 22px; padding: 16px; box-shadow: 6px 6px 0 var(--ink); }
  .bubble { background: var(--chat); border: 2px solid var(--ink); border-radius: 16px 16px 16px 4px; padding: 12px 14px; min-height: 140px;
    white-space: pre-wrap; word-break: break-word; font-size: 17px; cursor: text; }
  .bubble:empty::before { content: attr(data-placeholder); color: #6E5A4E; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .mark { border-radius: 3px; padding: 0 1px; background-repeat: no-repeat; background-size: 0% 100%; }
  .mark.ok { background-image: linear-gradient(rgba(46,122,76,.28), rgba(46,122,76,.28)); }
  .mark.no { text-decoration: underline wavy var(--no) 2px; text-underline-offset: 4px; text-decoration-color: transparent; }
  .mark.no.on { text-decoration-color: var(--no); }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  .btn { min-height: 46px; padding: 0 18px; border: 2px solid var(--ink); border-radius: 12px; cursor: pointer; font-weight: 700;
    background: var(--ink); color: var(--paper); box-shadow: 3px 3px 0 var(--box-deep); transition: transform .08s; }
  .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--box-deep); }
  .btn.ghost { background: #fff; color: var(--ink); }
  .btn.live { background: var(--no); border-color: var(--no); color: #fff; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  /* Printer + receipt */
  .printer-col { position: relative; }
  .printer { position: relative; z-index: 2; height: 58px; background: var(--ink); border-radius: 14px 14px 6px 6px; display: flex; align-items: center; padding: 0 16px; gap: 10px; }
  .printer .slot { position: absolute; left: 22px; right: 22px; bottom: 8px; height: 6px; border-radius: 3px; background: #000; }
  .led { width: 10px; height: 10px; border-radius: 50%; background: #5B4A40; }
  .led.on { background: #7CF0A6; box-shadow: 0 0 8px #7CF0A6; }
  .printer span { color: var(--paper); font-size: 13px; font-weight: 500; }
  .paper-wrap { overflow: hidden; margin: -8px 14px 0; padding-bottom: 14px; }
  .receipt { position: relative; background: var(--paper); font-family: 'Space Mono', monospace; font-size: 14px; padding: 22px 18px 26px;
    border-left: 2px solid rgba(42,25,18,.12); border-right: 2px solid rgba(42,25,18,.12);
    -webkit-mask: radial-gradient(circle 7px at 50% 100%, transparent 6.5px, #000 7px) 0 0 / 18px 100% repeat-x;
            mask: radial-gradient(circle 7px at 50% 100%, transparent 6.5px, #000 7px) 0 0 / 18px 100% repeat-x; }
  .receipt .head { text-align: center; border-bottom: 2px dashed var(--ink); padding-bottom: 10px; margin-bottom: 10px; }
  .receipt .head b { display: block; font-size: 16px; }
  .rline { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 3px 0; }
  .rline small { grid-column: 1 / -1; font-size: 12px; color: #6E5A4E; margin-top: -2px; }
  .rtotal { display: flex; justify-content: space-between; border-top: 2px dashed var(--ink); margin-top: 10px; padding-top: 10px; font-weight: 700; font-size: 18px; }
  .stamp { position: absolute; right: 8px; top: 6px; font-family: 'Space Grotesk'; font-weight: 700; font-size: 22px; padding: 4px 12px;
    border: 3px solid currentColor; border-radius: 8px; transform: rotate(-12deg); opacity: 0; pointer-events: none; }
  .stamp.ok { color: var(--ok); }
  .stamp.part { color: var(--no); }
  .idle { color: #6E5A4E; text-align: center; padding: 18px 0; font-size: 13px; }

  /* Held notes */
  .notes { display: grid; gap: 12px; margin-top: 4px; }
  .note { background: var(--note); border: 2px solid var(--ink); padding: 12px 14px 12px; box-shadow: 4px 4px 0 rgba(42,25,18,.85); }
  .note:nth-child(odd) { transform: rotate(-1.5deg); }
  .note:nth-child(even) { transform: rotate(1.2deg); }
  .note q { display: block; font-size: 13px; color: #5A4636; }
  .note p { margin: 4px 0 10px; font-weight: 700; }
  .note button { border: 2px solid var(--ink); background: #fff; border-radius: 8px; padding: 4px 10px; cursor: pointer; font-weight: 500; font-size: 14px; }

  /* Spike */
  .spike-col h2 { display: flex; justify-content: space-between; }
  .spike { position: relative; height: 210px; display: flex; justify-content: center; }
  .spike .rod { position: absolute; bottom: 18px; width: 4px; height: 180px; background: linear-gradient(#8C8C8C, #4A4A4A); border-radius: 2px 2px 0 0; }
  .spike .rod::before { content: ''; position: absolute; top: -10px; left: -2px; border: 4px solid transparent; border-bottom: 10px solid #8C8C8C; }
  .spike .base { position: absolute; bottom: 0; width: 120px; height: 20px; background: var(--ink); border-radius: 10px 10px 4px 4px; }
  .ticket { position: absolute; left: calc(50% - 52px); width: 104px; height: 56px; background: var(--paper); border: 2px solid rgba(42,25,18,.25); font: 11px/1.3 'Space Mono', monospace; padding: 6px 8px; overflow: hidden; }
  .ledger { margin-top: 14px; background: rgba(255,255,255,.7); border: 2px solid var(--ink); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
  .ledger summary { cursor: pointer; font-weight: 700; min-height: 28px; }
  .ledger table { margin-top: 8px; }
  .ledger table { width: 100%; border-collapse: collapse; }
  .ledger td { padding: 3px 0; vertical-align: top; }
  .ledger td.n { text-align: right; font-variant-numeric: tabular-nums; }
  .ledger .sum { border-top: 2px solid var(--ink); font-weight: 700; }
  .ledger .none { color: #5A4636; }
  .flyer { position: fixed; z-index: 50; pointer-events: none; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header>
  <svg class="logo" viewBox="0 0 64 44" aria-hidden="true">
    <path d="M12 8L7 22"/><path d="M22 8L17 22"/><path d="M47 22L42 36"/><path d="M57 22L52 36"/>
  </svg>
  <h1>Verbatim</h1>
  <span class="shop" id="shop"></span>
</header>

<main class="stage">
  <section class="chat" aria-labelledby="chat-h">
    <h2 id="chat-h">Customer message</h2>
    <div class="bubble" id="bubble" contenteditable="plaintext-only" role="textbox" aria-multiline="true"
      aria-labelledby="chat-h" data-placeholder="Paste the WhatsApp order here"></div>
    <div class="actions">
      <button class="btn" id="check">Check order</button>
      <button class="btn ghost" id="voice" aria-pressed="false">Record voice note</button>
    </div>
    <div id="status" class="sr" role="status" aria-live="polite"></div>
  </section>

  <section class="printer-col" aria-labelledby="rec-h">
    <h2 id="rec-h">Receipt</h2>
    <div class="printer"><i class="led" id="led"></i><span id="printer-text">Ready</span><i class="slot"></i></div>
    <div class="paper-wrap"><div class="receipt" id="receipt"><div class="idle">Only lines written in the message get printed.</div></div></div>
    <div class="actions" style="margin: 0 14px"><button class="btn" id="add" disabled>Add to order sheet</button></div>
    <div class="notes" id="notes" style="margin: 18px 14px 0" aria-label="Questions for the customer"></div>
  </section>

  <section class="spike-col" aria-labelledby="sheet-h">
    <h2 id="sheet-h"><span>Order sheet</span><span id="count">0 tickets</span></h2>
    <div class="spike" id="spike" aria-hidden="true"><i class="rod"></i><i class="base"></i></div>
    <details class="ledger">
      <summary>Show sheet</summary>
      <div id="ledger"></div>
      <div class="actions"><button class="btn ghost" id="csv">Download CSV</button></div>
    </details>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches || !window.gsap;
const tl = () => (calm ? null : gsap.timeline());
let currency = '$', shop = 'Verbatim', last = null, sheet = [];
try { sheet = JSON.parse(localStorage.getItem('verbatim-sheet') || '[]'); } catch {}
const save = () => { try { localStorage.setItem('verbatim-sheet', JSON.stringify(sheet)); } catch {} };
const money = n => currency + n.toFixed(2);

fetch('/api/catalog').then(r => r.json()).then(c => { currency = c.currency; shop = c.shop; $('shop').textContent = c.shop; });

// One load moment: the logo draws its own quote marks.
if (!calm) document.querySelectorAll('.logo path').forEach((p, i) => {
  const len = p.getTotalLength();
  gsap.fromTo(p, { strokeDasharray: len, strokeDashoffset: len }, { strokeDashoffset: 0, duration: .28, delay: .15 + i * .14, ease: 'power2.out' });
});

const messageText = () => $('bubble').innerText.trim();

// Editing after a check drops the marks so they never point at stale words.
$('bubble').addEventListener('input', () => {
  const b = $('bubble');
  if (!b.querySelector('.mark')) return;
  b.textContent = b.innerText;
  const range = document.createRange();
  range.selectNodeContents(b); range.collapse(false);
  getSelection().removeAllRanges(); getSelection().addRange(range);
});

// Mark each quote the model extracted inside the customer's own words.
function showBubble(text, marks) {
  const b = $('bubble');
  const lower = text.toLowerCase();
  const spans = [];
  for (const m of marks) {
    const re = new RegExp(m.quote.trim().split(/\s+/).map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('\\s+'));
    const hit = re.exec(lower);
    if (hit && !spans.some(s => hit.index < s.end && hit.index + hit[0].length > s.start)) spans.push({ start: hit.index, end: hit.index + hit[0].length, kind: m.kind });
  }
  spans.sort((a, b) => a.start - b.start);
  let html = '', at = 0;
  for (const s of spans) {
    html += esc(text.slice(at, s.start)) + `<span class="mark ${s.kind}">${esc(text.slice(s.start, s.end))}</span>`;
    at = s.end;
  }
  b.innerHTML = html + esc(text.slice(at));
  return [...b.querySelectorAll('.mark')];
}

function printer(on, text) { $('led').classList.toggle('on', on); $('printer-text').textContent = text; }

function render(r) {
  last = r;
  const marks = showBubble(r.transcript || r.message, [
    ...r.confirmed.map(l => ({ quote: l.quote, kind: 'ok' })), ...r.held.map(h => ({ quote: h.quote, kind: 'no' }))]);

  const receipt = $('receipt');
  receipt.innerHTML = `<div class="head"><b>${esc(shop)}</b>${r.transcript ? 'Voice note, ' : ''}${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</div>
    ${r.confirmed.map(l => `<div class="rline"><span>${l.pieces} × ${esc(l.name)}</span><span>${money(l.amount)}</span>
      ${l.unit !== 'piece' ? `<small>${l.quantity} ${esc(l.unit)} as written</small>` : ''}</div>`).join('') || '<div class="idle">Nothing confirmed yet.</div>'}
    <div class="rtotal"><span>Total</span><span>${money(r.total)}</span></div>
    <div class="stamp ${r.held.length ? 'part' : 'ok'}">${r.held.length ? 'PARTIAL' : 'CONFIRMED'}</div>`;
  $('notes').innerHTML = r.held.map((h, i) => `<div class="note"><q>${esc(h.quote)}</q><p>${esc(h.question)}</p><button data-copy="${i}">Copy question</button></div>`).join('');
  $('add').disabled = !r.confirmed.length;
  $('add').textContent = r.held.length && r.confirmed.length ? 'Add confirmed lines to sheet' : 'Add to order sheet';

  const t = tl();
  if (!t) { marks.forEach(m => { m.style.backgroundSize = '100% 100%'; m.classList.add('on'); }); receipt.querySelector('.stamp').style.opacity = 1; printer(false, 'Printed'); return; }
  printer(true, 'Printing…');
  marks.forEach(m => m.classList.contains('ok')
    ? t.to(m, { backgroundSize: '100% 100%', duration: .35, ease: 'power1.inOut' })
    : t.call(() => m.classList.add('on')).to(m, { x: -3, duration: .05, yoyo: true, repeat: 3 }));
  t.fromTo(receipt, { yPercent: -100 }, { yPercent: 0, duration: .5 + r.confirmed.length * .18, ease: 'steps(' + (6 + r.confirmed.length * 3) + ')' }, '-=.1')
   .from(receipt.querySelectorAll('.rline'), { opacity: 0, duration: .01, stagger: .18 }, '<')
   .fromTo(receipt.querySelector('.stamp'), { scale: 2.4, opacity: 0 }, { scale: 1, opacity: .9, duration: .22, ease: 'power4.in' })
   .to(receipt, { x: 2, duration: .04, yoyo: true, repeat: 3 })
   .from('#notes .note', { y: -40, rotate: () => gsap.utils.random(-14, 14), opacity: 0, duration: .35, stagger: .12, ease: 'back.out(2)' }, '-=.1')
   .call(() => printer(false, 'Printed'));
}

async function check(body, type) {
  $('status').textContent = type === 'voice' ? 'Transcribing on this machine…' : 'Reading the order…';
  printer(true, 'Reading…');
  $('check').disabled = true;
  try {
    const res = await fetch(type === 'voice' ? '/api/voice' : '/api/order', { method: 'POST', body, headers: type === 'voice' ? {} : { 'content-type': 'application/json' } });
    const r = await res.json();
    if (!res.ok) throw new Error(r.error);
    render(r);
    $('status').textContent = `${r.confirmed.length} confirmed, ${r.held.length} held for a reply.`;
  } catch (e) {
    printer(false, "Couldn't check. Try again");
    $('status').textContent = `Couldn't check this order: ${e.message}. Try again.`;
  } finally { $('check').disabled = false; }
}

$('check').onclick = () => {
  const message = messageText();
  if (!message) { printer(false, 'Paste a message first'); $('status').textContent = 'Paste a message first.'; $('bubble').focus(); return; }
  check(JSON.stringify({ message }), 'text');
};

$('notes').onclick = e => {
  const i = e.target.dataset.copy;
  if (i !== undefined) navigator.clipboard.writeText(last.held[i].question).then(() => { e.target.textContent = 'Copied'; });
};

let rec = null;
$('voice').onclick = async () => {
  if (rec) { rec.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const chunks = [];
    rec = new MediaRecorder(stream);
    rec.ondataavailable = e => chunks.push(e.data);
    rec.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      rec = null;
      Object.assign($('voice'), { textContent: 'Record voice note', className: 'btn ghost' }); $('voice').setAttribute('aria-pressed', 'false');
      check(new Blob(chunks, { type: 'audio/webm' }), 'voice');
    };
    rec.start();
    Object.assign($('voice'), { textContent: 'Stop and check', className: 'btn live' }); $('voice').setAttribute('aria-pressed', 'true');
    printer(true, 'Recording…');
    $('status').textContent = 'Recording. Press stop when done.';
  } catch { printer(false, 'Microphone blocked'); $('status').textContent = 'Microphone is blocked. Allow it in the browser and try again.'; }
};

function renderSheet() {
  const tickets = [...new Set(sheet.map(s => s.ticket))];
  $('count').textContent = `${tickets.length} ticket${tickets.length === 1 ? '' : 's'}`;
  const spike = $('spike');
  spike.querySelectorAll('.ticket').forEach(t => t.remove());
  tickets.slice(-6).forEach((id, i) => {
    const rows = sheet.filter(s => s.ticket === id);
    const el = document.createElement('div');
    el.className = 'ticket';
    el.style.bottom = (22 + i * 24) + 'px';
    el.style.transform = `rotate(${[-6, 4, -3, 7, -5, 2][i]}deg)`;
    el.innerHTML = `<b>#${tickets.indexOf(id) + 1}</b><br>${money(rows.reduce((n, s) => n + s.amount, 0))}`;
    spike.appendChild(el);
  });
  $('ledger').innerHTML = sheet.length ? `<table>${sheet.map(s => `<tr><td>#${tickets.indexOf(s.ticket) + 1}</td><td>${s.pieces} × ${esc(s.name)}</td><td class="n">${money(s.amount)}</td></tr>`).join('')}
    <tr class="sum"><td colspan="2">Total</td><td class="n">${money(sheet.reduce((n, s) => n + s.amount, 0))}</td></tr></table>`
    : '<span class="none">Empty. Confirmed receipts land here.</span>';
}

$('add').onclick = () => {
  const ticket = Date.now();
  sheet.push(...last.confirmed.map(l => ({ ticket, name: l.name, pieces: l.pieces, amount: l.amount })));
  save();
  $('add').disabled = true;
  $('status').textContent = 'Added to the order sheet.';
  if (calm) return renderSheet();
  // Tear the receipt off and spike it.
  const from = $('receipt').getBoundingClientRect(), to = $('spike').getBoundingClientRect();
  const fly = $('receipt').cloneNode(true);
  Object.assign(fly.style, { left: from.left + 'px', top: from.top + 'px', width: from.width + 'px' });
  fly.classList.add('flyer');
  document.body.appendChild(fly);
  gsap.timeline({ onComplete: () => { fly.remove(); renderSheet(); gsap.from('#spike .ticket:last-child', { y: -30, duration: .25, ease: 'bounce.out' }); } })
    .to(fly, { rotate: -4, y: 12, duration: .12 })
    .to(fly, { left: to.left + to.width / 2 - from.width * .15, top: to.top + 10, scale: .3, rotate: 8, duration: .45, ease: 'power3.in' })
    .to(fly, { opacity: 0, duration: .08 });
};

$('csv').onclick = () => {
  const ids = [...new Set(sheet.map(s => s.ticket))];
  const rows = [['ticket', 'item', 'pieces', 'amount'], ...sheet.map(s => [ids.indexOf(s.ticket) + 1, s.name, s.pieces, s.amount])];
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
  Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([csv], { type: 'text/csv' })), download: 'orders.csv' }).click();
};
renderSheet();
</script>
</body>
</html>
